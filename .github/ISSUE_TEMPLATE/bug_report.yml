name: Bug report
description: Report a reproducible problem in Tatu
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Tatu. Do not include secrets or personal data.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start Tatu with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit hash when known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, browser, or deployment details.
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs, screenshots, or other context. Never include credentials.
